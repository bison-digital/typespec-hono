name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node major `engines` admits, which is `>=22`. Re-read Node's release schedule when
        # that range moves.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: typespec-hono

      # **The library is a sibling checkout while `pnpm-workspace.yaml` links it**, which it does while
      # a change spanning both packages is unreleased. The link needs a target, and installing the
      # published version instead would test a pairing the commit was not written against.
      #
      # This is the arrangement `2650b6a` removed once the library first published, restored for the
      # same reason it first existed. It goes again, with the override, in the release that moves this
      # package's range to the published library: `release.yml` refuses to publish while the override
      # is present. Two checkouts both need `path:`, so there is no `package.json` at the workspace
      # root and `pnpm/action-setup` has to be pointed at one - without that it fails with "No pnpm
      # version is specified", naming a field that is present and correct.
      - uses: actions/checkout@v4
        with:
          repository: bison-digital/typespec-http-zod
          path: typespec-http-zod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typespec-hono/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: typespec-hono/pnpm-lock.yaml

      # The library is installed and BUILT first: this package resolves it through the link, and its
      # `exports` point at `dist/`, which a fresh checkout does not have.
      - run: pnpm install --frozen-lockfile
        working-directory: typespec-http-zod
      - run: pnpm build
        working-directory: typespec-http-zod

      - run: pnpm install --frozen-lockfile
        working-directory: typespec-hono
      - run: pnpm build
        working-directory: typespec-hono
      - run: pnpm test
        working-directory: typespec-hono
      # LAST, always, see the library's workflow for why.
      - run: pnpm typecheck
        working-directory: typespec-hono
      - run: pnpm lint
        working-directory: typespec-hono

      # A repository that calls itself idiomatic should not depend on whoever opens it next
      # having the same editor settings. `.oxfmtrc.json` matches the style the code is already
      # written in (tabs) rather than imposing the tool's defaults on it.
      - run: pnpm format:check
        working-directory: typespec-hono
